<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>
    <center>
    <table>
        <tr>
            <td>
                 <form target="_blank" action="RESPONSE.htm"> 
        <fieldset>
            <h1>Hotel Room Booking Form</h1>
            <label for="name">Full Name:</label>
            <input id="name" type="text" name="name" required>
            <br><br>
             <label for="email">Email:</label>
             <input type="email" id="email" name="email"  required>
             <br><br>
             <label for="tel">Phone:</label>
             <input type="tel" id="tel" name="tel" required>
             <br><br>
             <label for="checkin">Check-in Date:</label>
             <input type="date" id="checkin" name="checkin" required>
             <br><br>
             <label for="checkout">Check-out Date:</label>
             <input type="date" id="checkout" name="checkout" required>
             <br><br>
             <label for="select">Room Type</label>
             <select name="select" id="select">
             <option value="">Select Room</option>
             <option value="single room">Single Room</option>
             <option value="double room">Double Room</option>
             </select>
             <br><br>
             <label for="guests">Number of Guests:</label>
             <input type="number" id="guests" name="guests" required>
             <br><br>
             <label for="spclreq">Special Requests</label><br>
             <textarea name="spclreq" id="spclreq" rows="4" cols="50"></textarea>
             <br><br>
             <input type="submit" value="Book Now">
             <input type="reset" value="Reset Form"> 
        </fieldset> 


    </form>
            </td>
        </tr>
    </table>
    </center>
</body>
</html>
